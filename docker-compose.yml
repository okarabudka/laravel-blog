services:
  web:
    image: nginx:1.27-alpine
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/var/www:ro
      - ./docker/conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/conf/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-blog}
      MARIADB_USER: ${DB_USERNAME:-blog}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/conf/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/conf/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - ${MAILPIT_PORT:-8025}:8025
    restart: unless-stopped

volumes:
  db-data:
